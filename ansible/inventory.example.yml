---
# Copy to ansible/inventory.yml and fill in your values.
# Never commit inventory.yml (it's in .gitignore).

all:
  vars:
    # Where vps-git lives on each node
    vps_git_dir: /opt/vps-git
    # Git repo to clone
    vps_git_repo: https://github.com/youruser/vps-git.git

    # Shared secrets (same on both nodes)
    postgres_db: forgejo
    postgres_user: forgejo
    postgres_password: "CHANGEME"
    repl_user: replicator
    repl_password: "CHANGEME"

    # App config
    app_name: vps-git
    app_url: "https://git.example.com"
    forge_image: "codeberg.org/forgejo/forgejo:16"

    # Forgejo admin user (created on first deploy)
    forgejo_admin_user: "admin"
    forgejo_admin_password: "CHANGEME"
    forgejo_admin_email: "admin@example.com"

    # Forgejo security
    forgejo_disable_registration: true    # no public sign-ups
    forgejo_require_signin: true          # must log in to see anything
    forgejo_default_private: "private"    # new repos are private by default (private/public)

    # Backup -- how often (in seconds) the sidecar runs pg_dump + rsync to standby.
    # This is the max data loss window for git repo files on disk.
    # Database replicates in real-time regardless of this value.
    #   60  = every minute  (recommended for active repos)
    #   300 = every 5 min
    #   900 = every 15 min  (lighter on resources)
    backup_interval: 60

    # Offsite backups (restic to R2 or any S3-compatible store), nightly from the
    # serving primary only. Needs /etc/vps-git-backup/r2.env and restic-password
    # on each node, created by hand (see README "Offsite backups").
    offsite_backup_enabled: false

    # Live Discord status card edited every 15 minutes by the serving primary.
    # Needs DISCORD_WEBHOOK_URL and STATUS_MESSAGE_ID in /etc/vps-git-backup/notify.env
    # (see README "Notifications"; create the card once with stack/status-card.sh --create).
    status_card_enabled: false
    backup_ssh_key: /root/.ssh/id_ed25519

    # Cloudflare tunnel
    tunnel_name: vps-git
    tunnel_credentials_file: ""  # e.g. your-tunnel-uuid.json

    # Cloudflare email sending (SMTP)
    # Get API token from: Cloudflare Dashboard > My Profile > API Tokens
    # Token needs "Email Sending: Edit" permission
    # Domain must be onboarded for Email Sending in Cloudflare Dashboard > Email Service
    # NOTE: subdomains must be onboarded separately (Onboard Domain > subdomain)
    mail_from: "noreply@example.com"
    cf_api_token: "CHANGEME"

    # GitHub OAuth login
    # Create at: https://github.com/settings/developers > OAuth Apps > New OAuth App
    # Homepage URL: your Forgejo URL
    # Callback URL: your Forgejo URL + /user/oauth2/github/callback
    github_oauth_client_id: "CHANGEME"
    github_oauth_client_secret: "CHANGEME"

  children:
    primary:
      hosts:
        primary-vps:
          ansible_host: 203.0.113.10        # public or Tailscale IP
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          peer_host: 100.y.y.y              # standby's Tailscale IP
          pg_bind: "100.x.x.x"               # this node's Tailscale IP

    standby:
      hosts:
        standby-vps:
          ansible_host: 198.51.100.20       # public or Tailscale IP
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          peer_host: 100.x.x.x              # primary's Tailscale IP
          pg_bind: "100.x.x.x"               # this node's Tailscale IP

    # Watchdog -- Uptime Kuma + failover agent + cloudflared tunnel.
    # Use localhost for local deployment, or a remote host for a 3rd VPS.
    watchdog:
      hosts:
        localhost:
          ansible_connection: local

          # Path to the watchdog/ directory (local checkout)
          watchdog_dir: /path/to/vps-git/watchdog
          # Path to the repo root (for failover agent's Ansible access)
          watchdog_repo_dir: /path/to/vps-git

          # SSH keys the failover agent uses to reach VPS nodes
          watchdog_ssh_key_primary: /path/to/primary_ssh_key
          watchdog_ssh_key_standby: /path/to/standby_ssh_key

          # Cloudflare tunnel for Uptime Kuma status page
          watchdog_tunnel_uuid: "your-status-tunnel-uuid"
          watchdog_tunnel_credentials_file: /path/to/tunnel-uuid.json
          watchdog_tunnel_cert_file: ~/.cloudflared/cert.pem
          watchdog_status_hostname: "status-git.example.com"

          # Uptime Kuma admin (created on first run)
          kuma_username: admin
          kuma_password: "CHANGEME"

          # Tailscale IPs for port monitors
          primary_tailnet_ip: 100.x.x.x
          standby_tailnet_ip: 100.y.y.y

          # Failover tuning
          watchdog_check_interval: 30
          watchdog_fail_threshold: 3

          # Optional: Discord webhook URL for Uptime Kuma alerts (a default
          # notification attached to every monitor). Leave empty to skip.
          watchdog_discord_webhook: ""
