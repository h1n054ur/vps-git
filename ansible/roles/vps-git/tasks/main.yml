---
- name: Create vps-git directory
  ansible.builtin.file:
    path: "{{ vps_git_dir }}"
    state: directory
    mode: "0755"

- name: Clone / update vps-git repo
  ansible.builtin.git:
    repo: "{{ vps_git_repo }}"
    dest: "{{ vps_git_dir }}"
    version: main
    force: true

- name: Create cloudflared directory
  ansible.builtin.file:
    path: "{{ vps_git_dir }}/cloudflared"
    state: directory
    mode: "0755"

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vps_git_dir }}/stack/.env"
    mode: "0600"

- name: Template cloudflared config
  ansible.builtin.template:
    src: cloudflared-config.j2
    dest: "{{ vps_git_dir }}/cloudflared/config.yml"
    mode: "0644"

- name: Copy tunnel credentials
  ansible.builtin.copy:
    src: "{{ tunnel_credentials_file }}"
    dest: "{{ vps_git_dir }}/cloudflared/{{ tunnel_credentials_file | basename }}"
    owner: root
    group: "65532"
    mode: "0640"
  when: tunnel_credentials_file | length > 0

- name: Stop existing stack
  ansible.builtin.shell: >
    cd {{ vps_git_dir }}/stack &&
    docker compose --env-file .env down 2>/dev/null || true
  changed_when: true

- name: Start stack
  ansible.builtin.shell: >
    cd {{ vps_git_dir }}/stack &&
    docker compose --env-file .env up -d

# Live Discord status card. Needs DISCORD_WEBHOOK_URL and STATUS_MESSAGE_ID in
# /etc/forgejo-backup/notify.env (create the card once with status-card.sh --create).
- name: Install status card units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - vps-git-status.service
    - vps-git-status.timer
  register: status_units
  when: status_card_enabled | default(false) | bool

- name: Enable status card timer
  ansible.builtin.systemd:
    name: vps-git-status.timer
    enabled: true
    state: started
    daemon_reload: "{{ status_units is changed }}"
  when: status_card_enabled | default(false) | bool

- name: Wait for Postgres to be healthy
  ansible.builtin.shell: docker exec vps-git-postgres pg_isready -U {{ postgres_user }} -d {{ postgres_db }}
  register: pg_ready
  retries: 15
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

- name: Wait for Forgejo health
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/healthz"
    method: GET
    status_code: 200
  register: health
  retries: 30
  delay: 5
  until: health.status == 200

- name: Check if Forgejo install lock is set
  ansible.builtin.shell: >
    docker exec vps-git-forgejo
    grep -q 'INSTALL_LOCK.*=.*true' /data/gitea/conf/app.ini && echo "locked" || echo "unlocked"
  register: install_lock
  changed_when: false

- name: Set Forgejo install lock
  ansible.builtin.shell: >
    docker exec vps-git-forgejo
    sed -i 's/INSTALL_LOCK.*/INSTALL_LOCK = true/' /data/gitea/conf/app.ini
  when: install_lock.stdout | trim == "unlocked"

- name: Restart Forgejo after install lock
  ansible.builtin.shell: docker restart vps-git-forgejo
  when: install_lock.stdout | trim == "unlocked"

- name: Wait for Forgejo after restart
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/healthz"
    method: GET
    status_code: 200
  register: health2
  retries: 30
  delay: 5
  until: health2.status == 200
  when: install_lock.stdout | trim == "unlocked"

- name: Create Forgejo admin user
  ansible.builtin.shell: >
    docker exec --user git vps-git-forgejo
    forgejo admin user create
    --admin
    --username "{{ forgejo_admin_user }}"
    --password "{{ forgejo_admin_password }}"
    --email "{{ forgejo_admin_email }}"
  register: admin_create
  failed_when: admin_create.rc != 0 and 'already exists' not in (admin_create.stdout + admin_create.stderr)
  changed_when: admin_create.rc == 0

- name: List existing auth sources
  ansible.builtin.shell: docker exec --user git vps-git-forgejo forgejo admin auth list
  register: auth_list
  changed_when: false

- name: Register GitHub OAuth provider
  ansible.builtin.shell: >
    docker exec --user git vps-git-forgejo
    forgejo admin auth add-oauth
    --name github
    --provider github
    --key "{{ github_oauth_client_id }}"
    --secret "{{ github_oauth_client_secret }}"
    --scopes user:email --scopes read:user
    --skip-local-2fa
  register: oauth_create
  when: "'github' not in auth_list.stdout"

- name: Restart Forgejo after OAuth
  ansible.builtin.shell: docker restart vps-git-forgejo
  when: oauth_create is changed

- name: Wait for Forgejo after OAuth
  ansible.builtin.uri:
    url: "http://127.0.0.1:3000/api/healthz"
    method: GET
    status_code: 200
  register: health5
  retries: 30
  delay: 5
  until: health5.status == 200
  when: oauth_create is changed
