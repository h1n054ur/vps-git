---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - rsync
      - git
      - ca-certificates
      - gnupg
    state: present

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Install Docker (if not present)
  when: docker_check.rc != 0
  block:
    - name: Add Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg \
          -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker apt repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
        https://download.docker.com/linux/{{ ansible_distribution | lower }} \
        $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
        > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt after adding Docker repo
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# Postgres binds to the node's tailnet IP. Docker can start before the tailnet
# interface has its address, so allow binding to an address that isn't up yet.
- name: Allow binding to the tailnet IP before it is up
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-tailscale-bind.conf
    content: "net.ipv4.ip_nonlocal_bind = 1\n"
    mode: "0644"
  register: nonlocal_bind

- name: Apply nonlocal bind sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/60-tailscale-bind.conf
  when: nonlocal_bind is changed
