# vps-git service stack: one Forgejo instance (no standby since 2026-10-10).
#
#   docker compose --env-file .env up -d
#
# Backups run outside this stack (a nightly restic job on the host).

services:

  postgres:
    image: postgres:16-alpine
    container_name: vps-git-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  forgejo:
    image: ${FORGE_IMAGE:-codeberg.org/forgejo/forgejo:16}
    container_name: vps-git-forgejo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGEJO__server__APP_NAME: ${APP_NAME}
      FORGEJO__server__ROOT_URL: ${APP_URL}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: ${POSTGRES_DB}
      FORGEJO__database__USER: ${POSTGRES_USER}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtps
      FORGEJO__mailer__SMTP_ADDR: smtp.mx.cloudflare.net
      FORGEJO__mailer__SMTP_PORT: "465"
      FORGEJO__mailer__FROM: ${MAIL_FROM}
      FORGEJO__mailer__USER: api_token
      FORGEJO__mailer__PASSWD: ${CF_API_TOKEN}
      FORGEJO__service__DISABLE_REGISTRATION: ${FORGEJO_DISABLE_REGISTRATION:-true}
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: ${FORGEJO_REQUIRE_SIGNIN_VIEW:-true}
      FORGEJO__repository__DEFAULT_PRIVATE: ${FORGEJO_DEFAULT_PRIVATE:-private}
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: vps-git-cloudflared
    restart: unless-stopped
    depends_on:
      forgejo:
        condition: service_healthy
    command: >-
      tunnel --no-autoupdate
      --config /etc/cloudflared/config.yml
      run
    volumes:
      - ../cloudflared:/etc/cloudflared:ro

volumes:
  postgres_data:
  forgejo_data:
