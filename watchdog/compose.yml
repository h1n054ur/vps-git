name: git-watchdog

# Watchdog stack -- Uptime Kuma monitoring (the automatic failover was removed on
# 2026-10-10: Forgejo runs as one instance).
#
# docker compose --env-file .env up -d
# docker compose --env-file .env run --rm setup-kuma   # first-time monitor setup

services:

  kuma:
    image: louislam/uptime-kuma:2
    container_name: vps-git-kuma
    restart: unless-stopped
    environment:
      # Kuma 2 asks for a database on first start; SQLite keeps it self-contained.
      # An existing 1.x kuma.db is migrated in place on first start.
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: vps-git-status-tunnel
    restart: unless-stopped
    depends_on:
      - kuma
    command: >-
      tunnel --no-autoupdate
      --config /etc/cloudflared/config.yml
      run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

  setup-kuma:
    build: ./setup-kuma
    container_name: vps-git-setup-kuma
    profiles: ["setup"]
    depends_on:
      - kuma
    network_mode: "service:kuma"
    environment:
      KUMA_URL: http://localhost:3001
      KUMA_USERNAME: ${KUMA_USERNAME:-admin}
      KUMA_PASSWORD: ${KUMA_PASSWORD}
      HEALTH_URL: ${PRIMARY_HEALTH_URL}
      PRIMARY_HOST: ${PRIMARY_TAILNET_IP}

volumes:
  kuma_data:
